<!DOCTYPE html>
<html><head>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
</head><body>
<input type="file" id="f" accept=".xlsm,.xlsx">
<pre id="out" style="font-size:12px"></pre>
<script>
document.getElementById('f').onchange = function() {
  const reader = new FileReader();
  reader.onload = e => {
    const wb = XLSX.read(e.target.result, {type:'array', cellDates:true});
    const ws = wb.Sheets['Demanda Tactica'];
    // Row 6 = index 5 (0-based), cols 86-89 (0-based) = BK-BN ish
    // Find by header name
    const raw = XLSX.utils.sheet_to_json(ws, {header:1, raw:true});
    const hdrs = raw[4]; // row 5 = index 4
    const pctCols = {};
    hdrs.forEach((h,i) => {
      if(['% PLANIFICADO','% COMPLETADO','GAP','RATIO'].includes(String(h))) pctCols[h]=i;
    });
    let out = 'PCT col indices: ' + JSON.stringify(pctCols) + '\n\n';
    
    // Check cells directly for rows 6-8 (Excel rows, = indices 5-7)
    Object.entries(pctCols).forEach(([name, ci]) => {
      out += `=== ${name} (col ${ci}) ===\n`;
      for(let ri=5; ri<=8; ri++){
        const addr = XLSX.utils.encode_cell({r:ri, c:ci});
        const cell = ws[addr];
        if(!cell){ out += `  row${ri+1}: (no cell)\n`; continue; }
        out += `  row${ri+1}: v=${JSON.stringify(cell.v)}  w=${JSON.stringify(cell.w)}  t=${cell.t}  z=${JSON.stringify(cell.z)}  f=${cell.f?'(formula)':''}\n`;
      }
      out += '\n';
    });
    document.getElementById('out').textContent = out;
  };
  reader.readAsArrayBuffer(this.files[0]);
};
</script>
</body></html>
